name: Behavioral JavaScript evaluator contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --version
      - run: node --test ultrasec-v7/tests/behavioral_js.test.cjs
