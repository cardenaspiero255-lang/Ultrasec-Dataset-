name: V7 Public Evidence Status Attestation
# Manual, main-only. Attests provenance of PUBLIC status bytes, not private data.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attest-public-status:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify evidence-index gate and adversarial tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ultrasec-v7/tests -p 'test_v7_evidence_release_gate.py' -v
          mkdir -p dist/status
          python3 ultrasec-v7/tools/v7_evidence_release_gate.py \
            --manifest ultrasec-v7/verification/COMMERCIAL_EVIDENCE_INDEX.json \
            --root . --expect-blocked > dist/status/public-report.json
          cp ultrasec-v7/verification/COMMERCIAL_EVIDENCE_INDEX.json dist/status/public-index.json
          printf 'PUBLIC STATUS ONLY; NOT_CERTIFIED; NO PRIVATE DATA; NO COMMERCIAL RIGHTS ATTESTED\n' > dist/status/SCOPE.txt
          (cd dist/status && sha256sum public-index.json public-report.json SCOPE.txt > SHA256SUMS)
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C dist/status . | gzip -n > dist/ultrasec-v7-public-evidence-status.tar.gz
      - name: Attest public artifact provenance (NOT certification)
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/ultrasec-v7-public-evidence-status.tar.gz
      - name: Publish public status bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ultrasec-v7-public-evidence-status
          path: dist/ultrasec-v7-public-evidence-status.tar.gz
          if-no-files-found: error
