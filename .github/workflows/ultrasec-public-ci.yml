name: UltraSec Public Documentation - 7 Quality Gates
# Scope: public documentation integrity only; not a certificate for the private UltraSec dataset.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate_1:
    name: "1/7 Public asset boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check public repository policy
        run: python3 ultrasec-v7/tools/verify_public.py 01-public-asset-boundary

  gate_2:
    name: "2/7 Secret patterns + full-history Gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pinned revision (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check public repository policy
        run: python3 ultrasec-v7/tools/verify_public.py 02-secret-scan
      - name: Scan full Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3 pinned; public personal repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.24.3"
      - name: Audit all reachable Git history (including merge parents)
        shell: bash
        run: |
          set -euo pipefail
          scanner=/tmp/gitleaks-8.24.3/gitleaks
          if [[ ! -x "$scanner" ]]; then
            echo "::error::Pinned Gitleaks binary unavailable; aborting."
            exit 1
          fi
          "$scanner" detect --source . --log-opts="--all" --redact --exit-code=1

  gate_3:
    name: "3/7 Proprietary rights notice"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check public repository policy
        run: python3 ultrasec-v7/tools/verify_public.py 03-rights-notice

  gate_4:
    name: "4/7 Truthful status claims"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check public repository policy
        run: python3 ultrasec-v7/tools/verify_public.py 04-truthful-claims

  gate_5:
    name: "5/7 Public provenance metadata"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check public repository policy
        run: python3 ultrasec-v7/tools/verify_public.py 05-provenance-metadata

  gate_6:
    name: "6/7 Relative links"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check public repository policy
        run: python3 ultrasec-v7/tools/verify_public.py 06-public-link-integrity

  gate_7:
    name: "7/7 CI hardening / negative tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check public repository policy
        run: python3 ultrasec-v7/tools/verify_public.py 07-ci-hardening-tests
      - name: Run public CI security regression suite
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_public_hardening.py' -v
      - name: Validate audit evidence regressions
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_audit_register.py' -v
      - name: Validate enterprise metadata quality contract (synthetic tests only)
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_enterprise_metadata.py' -v
      - name: Validate blind enterprise benchmark scorecard (synthetic tests only)
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_enterprise_scorecard.py' -v
      - name: Validate same-holdout baseline comparison (synthetic tests only)
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_enterprise_comparison.py' -v
      - name: Validate sealed holdout privacy, replay protection and strict JSON parsing
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_sealed_buyer_cli.py' -v
      - name: Validate owner-local private corpus attestation on synthetic archives
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_private_corpus_attestation.py' -v
      - name: Validate lexical diversity screen on synthetic samples only
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_private_lexical_novelty.py' -v
      - name: Validate enterprise real-case evidence, blind reviews and adversarial SAST (synthetic contract tests)
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_premium_evidence_v7.py' -v
      - name: Enforce premium release cannot claim valuation without independent evidence
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_premium_release_gate.py' -v
      - name: Reject misleading premium PASS scenarios (Codex P1/P2 regression suite)
        run: python3 -m unittest discover -s ultrasec-v7/tests -p 'test_premium_security_regressions.py' -v

