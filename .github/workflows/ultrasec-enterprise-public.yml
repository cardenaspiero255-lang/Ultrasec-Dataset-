name: UltraSec Reference Benchmark - 7 Technical Evidence Gates
# Public, abstract reference fixture only. Not a certified scan of proprietary UltraSec data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate_1:
    name: "1/7 UltraSec Core — Pair & Causal Integrity [public fixture]"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify core on public reference graphs
        run: python3 ultrasec-v7/verification/reference_quality.py core

  gate_2:
    name: "2/7 Dataset Build — Reproducible SHA256 [public fixture]"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify build on public reference graphs
        run: python3 ultrasec-v7/verification/reference_quality.py build

  gate_3:
    name: "3/7 Unit Test Coverage — Measured >=85% [public fixture]"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned coverage tool in isolated environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check coverage==7.10.7
      - name: Run unit tests with branch coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=reference_quality -m unittest discover -s ultrasec-v7/tests -p 'test_*.py' -v
          .venv/bin/python -m coverage report --include='*/reference_quality.py' --fail-under=85

  gate_4:
    name: "4/7 Mutation Lab — Mutants Killed [public fixture]"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify mutation on public reference graphs
        run: python3 ultrasec-v7/verification/reference_quality.py mutation

  gate_5:
    name: "5/7 Adversarial Gauntlet — Fail Closed [public fixture]"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify adversarial on public reference graphs
        run: python3 ultrasec-v7/verification/reference_quality.py adversarial

  gate_6:
    name: "6/7 Self-Review Gate — Secure Workflow [public fixture]"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify self-review on public reference graphs
        run: python3 ultrasec-v7/verification/reference_quality.py self-review

  gate_7:
    name: "7/7 Reliability — 100 Deterministic Runs [public fixture]"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify reliability on public reference graphs
        run: python3 ultrasec-v7/verification/reference_quality.py reliability