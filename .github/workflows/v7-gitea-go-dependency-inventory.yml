# Public upstream-only import graph, not a legal SPDX clearance or new independent gold.
name: V7 Gitea static Go import closure research
on:
  pull_request:
    paths:
      - '.github/workflows/v7-gitea-go-dependency-inventory.yml'
      - 'ultrasec-v7/tools/gitea_go_dependency_closure.py'
      - 'ultrasec-v7/tests/test_gitea_go_dependency_closure.py'
      - 'ultrasec-v7/tools/gitea_module_license_evidence.py'
      - 'ultrasec-v7/tests/test_gitea_module_license_evidence.py'
      - 'ultrasec-v7/tools/gitea_couchbase_source_headers.py'
      - 'ultrasec-v7/tests/test_gitea_couchbase_source_headers.py'
      - 'ultrasec-v7/tools/couchbase_bsl_distribution_gate.py'
      - 'ultrasec-v7/tests/test_couchbase_bsl_distribution_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitea-import-closure:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 10 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: vulnerable
            sha: '7fdfb8d642201b388014f29889ef28e35b8c1872'
          - phase: fixed
            sha: 'e4ef995f2a162e3aca3f3a0b536afae067975d71'
    steps:
      - name: Fetch UltraSec audit scripts (no private corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify metadata parser on fictional fixtures
        run: python3 -m unittest discover -s ultrasec-v7/tests -p test_gitea_go_dependency_closure.py -v
      - name: Test safe file-level license evidence scanner on fictional Go modules
        run: python3 -m unittest discover -s ultrasec-v7/tests -p test_gitea_module_license_evidence.py -v
      - name: Unit-test Couchbase compiled file-level BSL screening
        run: python3 -m unittest discover -s ultrasec-v7/tests -p test_gitea_couchbase_source_headers.py -v
      - name: Fetch public upstream Gitea exact immutable commit
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/go-gitea/gitea.git
          git -C upstream fetch --depth 1 origin "$SOURCE_SHA"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C upstream rev-parse HEAD:LICENSE)" = a8d4b49dd073a4a38a7e58385eeff7cc52568697
          test "$(git -C upstream rev-parse HEAD:go.mod)" = 1f2e923ce21ee69e26b6e90e37146a633d3ad273
          test "$(git -C upstream rev-parse HEAD:go.sum)" = 34ab2024ed6e41ae05212044f383e846901e9c5e
      - name: Install Go release specified by original go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Resolve original Go service import closure with pinned module hashes
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          cd upstream
          export GOSUMDB=sum.golang.org
          export GOPROXY=https://proxy.golang.org
          go version
          go list -mod=readonly -tags sqlite -deps -json ./services/release > ../go-list-original.json
          cd ..
          mod_hash="$(sha256sum upstream/go.mod | cut -d' ' -f1)"
          sum_hash="$(sha256sum upstream/go.sum | cut -d' ' -f1)"
          license_hash="$(sha256sum upstream/LICENSE | cut -d' ' -f1)"
          python3 ultrasec-v7/tools/gitea_go_dependency_closure.py \
            --input go-list-original.json --commit "$SOURCE_SHA" \
            --go-mod-sha256 "$mod_hash" --go-sum-sha256 "$sum_hash" \
            --license-sha256 "$license_hash" --output gitea-go-closure.json
          echo 'Go import-closure derived from real original upstream, but file-level licenses, test dependencies, dynamic resources and commercialization remain NOT_VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory LICENSE and NOTICE evidence in actual imported third-party modules
        shell: bash
        run: |
          set -euo pipefail
          module_cache="$(cd upstream && go env GOMODCACHE)"
          python3 ultrasec-v7/tools/gitea_module_license_evidence.py \
            --go-list go-list-original.json \
            --closure gitea-go-closure.json \
            --go-mod-cache "$module_cache" \
            --output gitea-go-module-license-evidence.json
          echo 'Third-party module license FILE HASHES enumerated from Go cache. No inferred SPDX or commercial release clearance; unresolved files remain blocked.' >> "$GITHUB_STEP_SUMMARY"

      - name: Investigate only actually compiled Couchbase sources and nested BSL notice
        shell: bash
        run: |
          set -euo pipefail
          module_cache="$(cd upstream && go env GOMODCACHE)"
          python3 ultrasec-v7/tools/gitea_couchbase_source_headers.py \
            --go-list go-list-original.json --cache "$module_cache" \
            --closure gitea-go-closure.json \
            --output gitea-couchbase-actual-source-scope.json
          echo 'Couchbase BSL per-file/Change Date needs qualified scope review; NO source bytes uploaded; autonomous package remains BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce fail-closed actual-file Couchbase BSL distribution scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ultrasec-v7/tests -p test_couchbase_bsl_distribution_gate.py -v
          python3 ultrasec-v7/tools/couchbase_bsl_distribution_gate.py \
            --scope gitea-couchbase-actual-source-scope.json \
            --phase ${{ matrix.phase }} \
            --receipt couchbase-bsl-commercial-rights-gate.json
          python3 - <<'PY'
          import json
          data=json.load(open('couchbase-bsl-commercial-rights-gate.json'))
          assert data['commercial_distribution_allowed'] is False
          assert data['file_level_rights_verified'] is False
          assert data['certification']=='NOT_CERTIFIED'
          if data['phase']=='fixed':
              assert data['actual_original_source_files']==4
              assert data['source_header_bsl_references']==4
              assert data['legal_question']=='LICENSED_WORK_SCOPE_AMBIGUOUS'
          else:
              assert data['actual_original_source_files']==0
          print('ORIGINAL_COUCHBASE_BSL_FILE_SCOPE_VERIFIED; NO_COMMERCIAL_CLEARANCE')
          PY
          sha256sum couchbase-bsl-commercial-rights-gate.json > couchbase-bsl-gate-sha256.txt
          echo 'Original Couchbase licensing scope remains unresolved: autonomous commercial distribution blocked, no legal certification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive dependency references only, never original repo files or private examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitea-public-go-import-closure-${{ matrix.phase }}
          path: |
            gitea-go-closure.json
            gitea-go-module-license-evidence.json
            gitea-couchbase-actual-source-scope.json
            couchbase-bsl-commercial-rights-gate.json
            couchbase-bsl-gate-sha256.txt
          if-no-files-found: warn
          retention-days: 14
